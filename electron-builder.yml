appId: com.2-racemap-forwarder
productName: 2-racemap-forwarder
directories:
  output: dist
# Only the bundled app. Production node_modules are added by electron-builder.
files:
  - out/**
  - resources/icons/**
  - package.json
asarUnpack:
  - resources/**
npmRebuild: false
publish: null
afterPack: tools/adhoc-sign.cjs

# Asset names carry no version, so releases/latest/download/<name> links never break.
win:
  executableName: 2-racemap-forwarder
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
nsis:
  artifactName: 2-racemap-forwarder-win-${arch}-setup.${ext}
  shortcutName: 2 RACEMAP Forwarder
  uninstallDisplayName: 2 RACEMAP Forwarder
  createDesktopShortcut: always
portable:
  artifactName: 2-racemap-forwarder-win-${arch}-portable.${ext}

mac:
  icon: resources/icons/icon.icns
  category: public.app-category.utilities
  artifactName: 2-racemap-forwarder-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
  identity: null # signed ad-hoc in tools/adhoc-sign.cjs until there is a Developer ID
  notarize: false

linux:
  icon: resources/icons
  category: Utility
  maintainer: RACEMAP <info@racemap.com>
  artifactName: 2-racemap-forwarder-linux-x64.${ext}
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
